# Render Blueprint — deploy with "New +" -> "Blueprint" in the Render dashboard,
# pointing at this repo. Creates the web service + a free PostgreSQL database.
databases:
  - name: insurance-db
    plan: free

services:
  - type: web
    name: insurance-management-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: insurance-db
          property: connectionString
      - key: FRONTEND_URL
        value: "*"   # replace with your Vercel URL after the frontend is deployed
